<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>도블 게임</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
 --paper:#fbf9f4;--grid:rgba(96,128,170,.12);--ink:#262222;--sub:#5b524e;--mute:#8a807a;--line:#d8d0c3;
 --acc:#d6336c;--acc-soft:#fde3ec;--teal:#178f86;--teal-soft:#dff3f0;--sun:#ffd65a;--card:#fff;
 --ok:#2f8a5a;--ok-soft:#dcf3e5;--bad:#c2410c;--bad-soft:#fde4d8;
 --display:'Jua','Noto Sans KR',sans-serif;--body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
 --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;word-break:keep-all}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;-webkit-user-select:none;user-select:none}
button{font-family:var(--body);color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0;line-height:1.15}
h1 span{background:linear-gradient(transparent 58%,var(--sun) 58%,var(--sun) 92%,transparent 92%);padding:0 3px}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:18px 10px 20px 12px;padding:18px}
.btn{font-size:16px;font-weight:700;border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:11px 14px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.on{background:var(--teal-soft);border-color:var(--teal)}
.btn:disabled{opacity:.4}
input.name{width:100%;font-size:22px;padding:12px 14px;border:2.5px solid var(--ink);border-radius:14px;font-family:var(--body);margin:12px 0;-webkit-user-select:text;user-select:text}
.err{color:var(--bad);font-weight:700;min-height:1.4em;font-size:15px}
/* 위쪽 줄 */
.top{position:sticky;top:0;z-index:20;background:rgba(251,249,244,.95);backdrop-filter:blur(4px);border-bottom:2px solid var(--line);padding:8px 12px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;border:2px solid var(--ink);background:#fff;white-space:nowrap}
.chip.real{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.prac{background:var(--teal-soft);border-color:var(--teal)}
.who{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.timer{font:400 26px/1 var(--display);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.timer.low{color:var(--acc)}
.score{font:400 20px/1 var(--display);color:var(--acc);white-space:nowrap}
/* 대기 */
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.howto div{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:13px;color:var(--sub)}
.howto b{display:block;font-size:24px;margin-bottom:2px;font-family:var(--emoji)}
.big{font-family:var(--display);font-size:26px;text-align:center;margin:8px 0}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.res div{border:2px solid var(--ink);border-radius:12px;padding:10px 4px;background:#fff}
.res b{display:block;font:400 30px/1.1 var(--display);color:var(--acc)}
.res span{font-size:12px;color:var(--sub)}
/* 게임 공통 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.tabs .btn{flex:0 0 auto;padding:7px 12px;font-size:14px;border-width:2px}
.nums{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.num{flex:0 0 auto;min-width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;font:400 18px/1 var(--display);color:var(--ink);cursor:pointer;padding:0 6px}
.num.seen{border-color:#e08a00;background:#fff4e0}
.num.done{border-color:var(--ok);background:#e3f4ea;color:var(--ok)}
.num.done::after{content:"✓";font-size:12px;margin-left:2px}
.num.cur{outline:3px solid var(--ink);outline-offset:1px}
.num.lock{background:#efebe4;border-color:#e2dcd2;color:#b9b0a3;cursor:not-allowed;font-size:13px}
.ptitle2{font-family:var(--display);font-size:21px;text-align:center;margin:2px 0}
.lead{font-size:14px;color:var(--sub);text-align:center;margin:0 0 4px;line-height:1.5}
.msg{text-align:center;font-weight:700;min-height:1.5em;margin:6px 0;font-size:15px;line-height:1.45}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.ctrl{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.ctrl .btn{padding:10px 4px;font-size:15px}
.ctrl .btn.wide{grid-column:1/-1}
.hintc{font-size:12px;opacity:.8;display:block;margin-top:1px;font-weight:500}
.note{font-size:13px;color:var(--sub);text-align:center;margin-top:8px;line-height:1.5}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.stat3 div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 4px;text-align:center}
.stat3 b{display:block;font:400 26px/1.1 var(--display);color:var(--acc)}
.stat3 span{font-size:12px;color:var(--sub)}
.sec{font-family:var(--display);font-size:19px;margin:12px 0 4px}
/* ═════ 도블 카드 ═════ */
.dc{position:relative;border-radius:50%;background:#fff;border:2.5px solid var(--ink);flex:0 0 auto;padding:0;touch-action:manipulation;box-shadow:0 2px 0 rgba(38,34,34,.12)}
.dc .p{position:absolute;transform:translate(-50%,-50%);font-family:var(--emoji);line-height:1;border:0;background:none;padding:0;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.dc .p i{font-style:normal;display:block;transition:transform .15s}
.dc .p.slot{border:2.5px dashed #b9ad9c;background:#f7f2ea;color:#a39785;font:400 1em/1 var(--display)}
.dc .p.slot.fill{border-style:solid;border-color:var(--teal);background:var(--teal-soft)}
.dc .p.slot.hint{border-style:solid;border-color:#e0a800;background:#fff3c4}
.dc .p.slot.next{box-shadow:0 0 0 3px var(--acc-soft);border-color:var(--acc)}
.dc .p.good{background:var(--ok-soft);box-shadow:0 0 0 4px var(--ok)}
.dc .p.good i{transform:scale(1.18)}
.dc .p.mark{background:#fff3c4;box-shadow:0 0 0 3px #e0a800}
.dc .p.wrong{animation:shake .35s}
@keyframes shake{25%{transform:translate(calc(-50% - 6px),-50%)}75%{transform:translate(calc(-50% + 6px),-50%)}}
.dc .no{position:absolute;left:-4px;top:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:#fff;font:400 13px/22px var(--display);text-align:center;padding:0 5px}
.dc.blank{border-color:#e0a800;border-width:3px;background:#fffdf3}
.dc.sel{outline:4px solid var(--acc);outline-offset:3px}
.dc.bad{border-color:var(--bad);background:var(--bad-soft)}
.dc.dim{opacity:.35}
.dc.pick{outline:4px solid var(--teal);outline-offset:2px}
/* 스피드 */
.duo{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0}
.vs{font:400 15px/1 var(--display);color:var(--mute)}
.lockv{position:relative}
.lockv::after{content:"잠깐!";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 30px var(--display);color:var(--bad);background:rgba(251,249,244,.55);border-radius:20px}
/* 모든 카드 */
.cgrid{display:grid;gap:8px;justify-items:center;margin-top:6px}
.pal{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.pal.scroll{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:2px 2px 8px}
.pb{position:relative;width:46px;height:46px;flex:0 0 auto;border:2px solid var(--line);border-radius:12px;background:#fff;font:26px/1 var(--emoji);cursor:pointer;padding:0;touch-action:manipulation}
.pb.on{border-color:var(--teal);background:var(--teal-soft);box-shadow:0 0 0 2px var(--teal)}
.pb.full{opacity:.35}
.pb small{position:absolute;right:-5px;top:-7px;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:#fff;font:700 11px/18px var(--body);padding:0 4px}
/* 만들기 */
.mk{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
.mylist{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
/* 실전 */
.edit{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:8px;background:#fff;border:2px dashed var(--line);border-radius:16px;padding:8px}
.edit .pal{margin:0;flex:1;min-width:0}
/* 내 기록 */
.hist{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.hist h3{font-family:var(--display);font-weight:400;font-size:22px;margin:4px 0 0}
.hc{background:#fff;border:2px solid var(--ink);border-radius:14px 8px 16px 10px;padding:12px 14px}
.hc .ht{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hc .ht b{font-family:var(--display);font-weight:400;font-size:19px}
.hc .ht span{font-size:12px;color:var(--mute);white-space:nowrap}
.hc .hl{font-size:15px;margin-top:4px;line-height:1.6}
.hc .hl em{font-style:normal;font-weight:800;color:var(--acc)}
.hc .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hc .chips span{background:#f3eee6;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
/* 덮개 */
.ov{position:fixed;inset:0;z-index:60;background:rgba(38,34,34,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.ov .card{max-width:420px;width:100%;text-align:center}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:70;background:#fff;border:3px solid var(--ok);border-radius:20px;padding:18px 26px;text-align:center;font-family:var(--display);font-size:28px;color:var(--ok);box-shadow:0 10px 30px rgba(0,0,0,.2);animation:pop .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
.toast small{display:block;font-family:var(--body);font-size:14px;color:var(--sub);margin-top:4px}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
.net{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#fff3cd;border:2px solid #e0b400;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;z-index:80}
@media (prefers-reduced-motion:reduce){.dc .p.wrong{animation:none}.dc .p i{transition:none}}
</style>
</head>
<body>
<div class="top" id="top" hidden>
 <div class="top-in"><span class="who" id="who"></span><span class="chip" id="modeChip"></span><span class="score" id="scoreTxt"></span><span class="timer" id="timer"></span></div>
</div>
<div class="wrap">
 <!-- 입장 -->
 <section id="s-join" hidden>
  <div style="margin:30px 0 18px"><h1><span>도블</span><br>놀이터</h1></div>
  <div class="card">
   <label for="nameIn" style="font-weight:700">내 별명</label>
   <input id="nameIn" class="name" maxlength="12" placeholder="예: 별빛토끼" autocomplete="off">
   <button class="btn pri" id="joinBtn" style="width:100%;font-size:19px">입장하기</button>
   <div class="err" id="joinErr"></div>
  </div>
 </section>
 <!-- 대기 -->
 <section id="s-wait" hidden>
  <div class="card" style="margin-top:14px">
   <div class="big" id="waitTitle">선생님이 게임을 시작하면 열려요</div>
   <p class="note" id="waitSub">화면을 켜 둔 채로 기다려요.</p>
   <div id="lastRes" hidden>
    <div class="res"><div><b id="rScore">0</b><span>점수</span></div><div><b id="rSolved">0</b><span>성공한 문제</span></div><div><b id="rRank">-</b><span>순위</span></div></div>
   </div>
  </div>
  <div class="howto"><div><b>👀</b>두 카드에서<br>같은 그림 찾기</div><div><b>🃏</b>미니 도블<br>만들기</div><div><b>❓</b>빠진 카드<br>찾기</div></div>
  <div class="hist" id="hist" hidden></div>
 </section>
 <!-- 게임 -->
 <section id="s-game" hidden>
  <div class="tabs" id="deckTabs" hidden></div>
  <div class="tabs" id="viewTabs" hidden></div>
  <div class="tabs" id="poolTabs" hidden></div>
  <div class="nums" id="nums" hidden></div>
  <div class="ptitle2" id="pTitle"></div>
  <p class="lead" id="pLead"></p>
  <div class="msg" id="msg"></div>
  <div id="stage"></div>
  <div class="ctrl" id="ctrl"></div>
  <p class="note" id="gnote"></p>
 </section>
</div>
<div class="ov" id="pauseOv" hidden><div class="card"><div class="big">잠깐 멈춤 ✋</div><p class="note">선생님 설명을 들어요. 남은 시간은 그대로예요.</p></div></div>
<div class="net" id="net" hidden>연결을 다시 시도하는 중…</div>

<script src="config.js"></script>
<script>
/* ═════════ 서버 호출 ═════════ */
/* 화면을 밖(Vercel 등)에 올린 경우: config.js의 API_URL로 앱스스크립트와 데이터만 주고받는다 */
function apiReady(){return typeof window.API_URL==='string'&&/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec/.test(window.API_URL)}
function call(fn){const args=[].slice.call(arguments,1);
 if(window.API_URL!==undefined){
  if(!apiReady())return Promise.reject(new Error('config.js에 앱스스크립트 웹 앱 주소(…/exec)를 넣어 주세요.'));
  const ctl=window.AbortController?new AbortController():null;const tm=setTimeout(()=>{if(ctl)ctl.abort()},20000);
  return fetch(window.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow',signal:ctl?ctl.signal:undefined})
   .then(r=>{if(!r.ok)throw new Error('서버 응답 오류 ('+r.status+')');return r.json()})
   .then(j=>{if(!j||!j.ok)throw new Error((j&&j.error)||'알 수 없는 오류');return j.data})
   .catch(e=>{if(e&&e.name==='AbortError')throw new Error('서버 응답이 늦어요');throw e})
   .finally(()=>clearTimeout(tm))}
 return new Promise((res,rej)=>{
 if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))[fn].apply(null,args)}
 else if(window.__gs){window.__gs(fn,args).then(r=>{if(r&&r.__err)rej(new Error(r.__err));else res(r)},rej)}
 else rej(new Error('서버에 연결할 수 없어요'))})}
const $=id=>document.getElementById(id);
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function errText(e){return String((e&&e.message)||e).replace(/^Error:\s*/,'').replace(/^Exception:\s*/,'')}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* 받침에 따라 은/는, 이/가 */
function josa(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+a+'('+b+')';return w+((c-0xAC00)%28?a:b)}

/* ═════════ 앱 상태 ═════════ */
const A={name:null,token:null,bank:null,offset:0,state:{status:'idle'},me:null,round:null,game:null,mode:null,
 busy:false,pollT:null,activity:'대기',cls:{},
 sp:{deck:'d8',view:'speed',pair:null,lock:false,count:0,streak:0,queue:[],sending:false,sel:[],mark:null},
 bd:{pool:7,cards:{},best:{},stuck:{},cur:[],sel:null},
 real:{cur:0,saved:{},seen:{}}};
const DN={d3:'그림 3개',d4:'그림 4개',d8:'그림 8개'};

/* ═════════ 입장 ═════════ */
async function boot(){
 const saved=store('dobble_me');
 try{A.bank=await call('api_bank')}catch(e){$('s-join').hidden=false;$('joinErr').textContent='서버에 연결하지 못했어요: '+errText(e)+' (새로 고쳐 보세요)';return}
 if(saved&&saved.name){try{const r=await call('api_join',saved.name,saved.token);return entered(r)}catch(e){}}
 show('join');
}
async function join(){
 const n=$('nameIn').value.trim();if(!n){$('joinErr').textContent='별명을 써 주세요.';return}
 $('joinBtn').disabled=true;$('joinErr').textContent='';
 try{const saved=store('dobble_me');const r=await call('api_join',n,saved&&saved.name===n?saved.token:'');entered(r)}
 catch(e){$('joinErr').textContent=errText(e)}finally{$('joinBtn').disabled=false}
}
function entered(r){A.name=r.name;A.token=r.token;store('dobble_me',r);$('who').textContent=r.name;$('top').hidden=false;show('wait');loadHistory();poll();}
$('joinBtn').onclick=join;$('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
function show(w){['join','wait','game'].forEach(x=>$('s-'+x).hidden=x!==w)}

/* ═════════ 상태 확인 (몇 초마다) ═════════ */
async function poll(){
 clearTimeout(A.pollT);
 await flushSpeed();
 try{const t0=Date.now();const r=await call('api_poll',A.name,A.token,A.activity);A.offset=r.now-(t0+Date.now())/2;$('net').hidden=true;await apply(r)}
 catch(e){const m=errText(e);if(/다시 입장/.test(m)){store('dobble_me',{});location.reload();return}$('net').hidden=false}
 A.pollT=setTimeout(poll,3500+Math.random()*1000);
}
async function apply(r){
 const s=r.state;A.state=s;
 if(r.me&&!A.busy){A.me=r.me;if(A.game==='real'&&A.real.shownReach!==reachN())drawNums()}
 if(r.cls){A.cls=r.cls;if(A.game==='build')drawBuildStats()}
 $('pauseOv').hidden=s.status!=='paused';
 const live=s.status==='running'||s.status==='paused';
 if(live&&s.roundId!==A.round)await startRound(s);
 else if(!live&&A.round&&s.roundId===A.round&&s.status==='ended')endRound(r);
 else if(!live&&!A.round)waitScreen(r);
 updTop();
}
function waitScreen(r){
 show('wait');A.activity='대기';const s=r.state;
 if(s.status==='ended'&&s.mode==='real'&&r.me){$('lastRes').hidden=false;$('waitTitle').textContent='지난 게임 결과';$('rScore').textContent=r.me.score;$('rSolved').textContent=r.me.solved;$('rRank').textContent=r.rank?r.rank+'등':'-';$('waitSub').textContent='다음 활동을 기다려요.'}
 else if(s.status==='ended'&&s.roundId){$('lastRes').hidden=true;$('waitTitle').textContent='활동 끝!';$('waitSub').textContent='수고했어요. 다음 활동을 기다려요.'}
 else{$('lastRes').hidden=true;$('waitTitle').textContent='선생님이 게임을 시작하면 열려요';$('waitSub').textContent='화면을 켜 둔 채로 기다려요.'}
}
function endRound(r){
 A.round=null;A.activity='게임 끝';show('wait');waitScreen(r);setTimeout(loadHistory,600);
 $('waitTitle').textContent=r.state.mode==='real'?'게임 끝! 🎉':'활동 끝!';
 if(r.state.mode!=='real'){$('lastRes').hidden=true;$('waitSub').textContent='수고했어요. 다음 활동을 기다려요.'}
}
function updTop(){
 const s=A.state;const live=s.status==='running'||s.status==='paused';
 $('modeChip').hidden=!live;$('scoreTxt').hidden=!(live&&(s.mode==='real'||s.game==='speed'));$('timer').hidden=!live;
 if(live){$('modeChip').textContent=(s.mode==='real'?'실전':'연습');$('modeChip').className='chip '+(s.mode==='real'?'real':'prac');
  $('scoreTxt').textContent=s.game==='speed'?'⚡'+A.sp.count:(A.me?A.me.score:0)+'점'}
}
setInterval(()=>{const s=A.state;if(s.status!=='running'&&s.status!=='paused')return;
 const left=s.status==='paused'?s.remainMs:s.endAt-(Date.now()+A.offset);

 ['deckTabs','viewTabs','poolTabs','nums'].forEach(x=>$(x).hidden=true);

/* ═════════ 도블 카드 그리기 ═════════
   pics: 그림 번호 목록(null = 빈칸) · size: 지름(px) · o: {id, no, lay(섞은 배치), rot(카드 전체 회전), cls, slotCls(i)} */
const PIC=i=>A.bank.pics[i];
function layout(k){
 if(k===3)return[[0,-.42],[.38,.24],[-.38,.24]].map(p=>p.concat(.36));
 if(k===4)return[[-.3,-.3],[.3,-.3],[-.3,.3],[.3,.3]].map(p=>p.concat(.32));
 const o=[[0,0,.27]];for(let j=0;j<k-1;j++){const a=-Math.PI/2+j*2*Math.PI/(k-1);o.push([Math.cos(a)*.6,Math.sin(a)*.6,.26])}return o}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
/* 씨앗이 같으면 늘 같은 수열 (mulberry32) */
function rng(seed){return function(){seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
/* 스피드 카드의 섞은 배치: 카드마다 한 번 정해서 기억(인쇄된 카드처럼 같은 카드는 늘 같은 모양).
   그림 8개: 크기를 크게·중간·작게 섞어 겹치지 않게 아무 자리에, 방향은 0~360°.
   그림 3·4개: 자리는 거의 그대로, 크기·방향만 섞기.
   돌려주는 값: [[x, y, 크기, 방향], …] — x·y는 반지름 단위(−1~1), 크기는 지름에 대한 비율 */
const LAY={},SIZES8=[.32,.29,.27,.25,.23,.21,.19,.18],MIN_S=.17;
function scatter(key,k){
 if(LAY[key])return LAY[key];
 const R=rng(hash(key)),out=[];
 if(k<=4){const f=[.84,1,1.14,1.07].slice(0,k);for(let i=f.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[f[i],f[j]]=[f[j],f[i]]}   // 작게·보통·크게를 섞어서
  layout(k).forEach(([x,y,s],i)=>out.push([x+(R()-.5)*.12,y+(R()-.5)*.12,Math.max(MIN_S,s*(f[i]+(R()-.5)*.04)),Math.floor(R()*360)]))}
 else{
  const base=SIZES8.slice(0,k);while(base.length<k)base.push(MIN_S);
  let pts=null;
  for(let t=0;t<200&&!pts;t++){const got=[];let ok=true;
   for(const sz of base){const r=sz/2,maxd=.47-r;let placed=false;
    for(let q=0;q<400;q++){const a=R()*Math.PI*2,d=Math.sqrt(R())*maxd,x=Math.cos(a)*d,y=Math.sin(a)*d;
     if(got.every(g=>Math.hypot(g.x-x,g.y-y)>=1.05*(g.r+r))){got.push({x,y,r});placed=true;break}}
    if(!placed){ok=false;break}}
   if(ok)pts=got}
  if(!pts)pts=layout(k).map(([x,y,s])=>({x:x/2,y:y/2,r:s/2}));   // 만약을 위한 기본 배치
  for(let i=pts.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[pts[i],pts[j]]=[pts[j],pts[i]]}   // 어떤 그림이 큰지 섞기
  pts.forEach(g=>out.push([g.x*2,g.y*2,g.r*2,Math.floor(R()*360)]))}
 return LAY[key]=out}
function cardHtml(pics,size,o){
 o=o||{};const L=o.lay||layout(pics.length),R=size/2;
 let h=`<div class="dc${o.cls?' '+o.cls:''}" ${o.id!==undefined?`data-c="${o.id}"`:''} style="width:${size}px;height:${size}px${o.rot?`;transform:rotate(${o.rot}deg)`:''}" role="group" aria-label="${o.no?o.no+'번 ':''}카드">`;
 pics.forEach((p,i)=>{const[x,y,s]=L[i];const rot=L[i][3]||0;
  const d=Math.round(size*s),fs=Math.round(d*.78);
  const cls='p'+(p===null?' slot':'')+(o.slotCls?o.slotCls(i,p):'');
  h+=`<button class="${cls}" data-i="${i}" data-p="${p===null?'':p}" style="left:${R+x*R}px;top:${R+y*R}px;width:${d}px;height:${d}px;font-size:${p===null?Math.round(d*.5):fs}px" aria-label="${p===null?'빈칸':PIC(p).n}"><i style="${rot?`transform:rotate(${rot}deg)`:''}">${p===null?'?':PIC(p).e}</i></button>`});
 if(o.no)h+=`<span class="no">${o.no}</span>`;
 return h+'</div>'}
function W(){return Math.min(window.innerWidth-24,536)}

/* ═════════ 1) 스피드 체험 ═════════ */
function openSpeed(){
 const fixed=A.state.deck&&A.state.deck!=='free';if(fixed)A.sp.deck=A.state.deck;
 $('deckTabs').hidden=fixed;$('viewTabs').hidden=false;
 $('deckTabs').innerHTML=['d3','d4','d8'].map(d=>`<button class="btn${d===A.sp.deck?' on':''}" data-d="${d}">${DN[d]}</button>`).join('');
 $('deckTabs').querySelectorAll('.btn').forEach(b=>b.onclick=()=>{A.sp.deck=b.dataset.d;A.sp.sel=[];A.sp.mark=null;A.sp.pair=null;openSpeed()});
 $('viewTabs').innerHTML=`<button class="btn${A.sp.view==='speed'?' on':''}" data-v="speed">⚡ 같은 그림 찾기</button><button class="btn${A.sp.view==='all'?' on':''}" data-v="all">🃏 모든 카드 보기</button>`;
 $('viewTabs').querySelectorAll('.btn').forEach(b=>b.onclick=()=>{A.sp.view=b.dataset.v;openSpeed()});
 if(!A.sp.pair||A.sp.pair.d!==A.sp.deck)newPair();
 drawSpeed();
}
function newPair(){const n=A.bank.decks[A.sp.deck].n;let a=Math.floor(Math.random()*n),b;do{b=Math.floor(Math.random()*n)}while(b===a);
 A.sp.pair={d:A.sp.deck,a,b,t:Date.now(),ra:Math.floor(Math.random()*360),rb:Math.floor(Math.random()*360)}}   // 볼 때마다 카드 전체도 돌림
const deckCard=(d,i)=>A.bank.decks[d].cards[i].map(s=>A.bank.decks[d].pics[s]);
function common(d,a,b){const B=deckCard(d,b);return deckCard(d,a).find(x=>B.indexOf(x)>=0)}
function drawSpeed(){
 const D=A.bank.decks[A.sp.deck];
 if(A.sp.view==='all')return drawAll();
 $('pTitle').textContent=DN[A.sp.deck]+' 카드';$('pLead').innerHTML='두 카드에 <b>똑같이 있는 그림</b>을 찾아 톡! 어느 카드에서 눌러도 돼요.';
 A.activity='스피드: '+DN[A.sp.deck]+' (찾은 '+A.sp.count+')';
 const P=A.sp.pair,sz=Math.floor(Math.min(W()-20,(window.innerHeight-(A.state.deck&&A.state.deck!=='free'?290:340))/2,340));
 $('stage').innerHTML=`<div class="duo" id="duo">${cardHtml(deckCard(P.d,P.a),Math.max(170,sz),{id:'a',lay:scatter(P.d+':'+P.a,D.k),rot:P.ra})}<span class="vs">같은 그림은 딱 하나!</span>${cardHtml(deckCard(P.d,P.b),Math.max(170,sz),{id:'b',lay:scatter(P.d+':'+P.b,D.k),rot:P.rb})}</div>`;
 // 카드 안 아무 곳을 눌러도 가장 가까운 그림이 눌려요(작은 그림도 누르기 쉽게)
 $('stage').querySelectorAll('.duo .dc').forEach(c=>c.onclick=e=>{const ps=[...c.querySelectorAll('.p')];let el=e.target.closest('.p');
  if(e.clientX||e.clientY){let best=1e9;ps.forEach(q=>{const b=q.getBoundingClientRect(),dd=Math.hypot(b.left+b.width/2-e.clientX,b.top+b.height/2-e.clientY);if(dd<best){best=dd;el=q}})}
  if(el)speedTap(+el.dataset.p,el)});
 $('ctrl').innerHTML=`<div class="stat3" style="grid-column:1/-1"><div><b id="spN">${A.sp.count}</b><span>찾은 개수</span></div><div><b id="spS">${A.sp.streak}</b><span>연속</span></div><div><b>${D.n}</b><span>이 덱의 카드 수</span></div></div>`;
 $('gnote').textContent='틀리면 1초 동안 잠겨요. 찾은 개수가 선생님 화면에 모여요.';
}
async function speedTap(p,el){
 if(A.sp.lock||!canPlay())return;
 const P=A.sp.pair,c=common(P.d,P.a,P.b);
 if(p===c){A.sp.lock=true;A.sp.count++;A.sp.streak++;A.sp.queue.push([P.d,P.a,P.b]);
  $('stage').querySelectorAll(`.p[data-p="${c}"]`).forEach(x=>x.classList.add('good'));
  setMsg('딩동! '+PIC(c).e+' '+PIC(c).n,'ok');updTop();$('spN').textContent=A.sp.count;$('spS').textContent=A.sp.streak;
  await sleep(550);A.sp.lock=false;newPair();if(A.game==='speed'&&A.sp.view==='speed'){drawSpeed();setMsg('')}
 }else{A.sp.lock=true;A.sp.streak=0;el.classList.add('wrong');$('duo').classList.add('lockv');setMsg(josa(PIC(p).n,'은','는')+' 한쪽 카드에만 있어요.','bad');$('spS').textContent=0;
  await sleep(1000);A.sp.lock=false;const d=$('duo');if(d)d.classList.remove('lockv');el.classList.remove('wrong')}
}
async function flushSpeed(){
 if(A.sp.sending||!A.sp.queue.length||A.game!=='speed')return;
 const items=A.sp.queue.splice(0,60);A.sp.sending=true;
 try{await call('api_speed',A.name,A.token,{roundId:A.round,items})}catch(e){if(!/게임 시간|라운드|다른 활동/.test(errText(e)))A.sp.queue=items.concat(A.sp.queue)}
 finally{A.sp.sending=false}
}
/* 모든 카드 보기: 카드 두 장을 고르면 같은 그림이 보이고, 그림을 고르면 그 그림이 든 카드가 모두 보여요 */
function drawAll(){
 const d=A.sp.deck,D=A.bank.decks[d],k=D.k,cols=D.n>13?3:(k===3?4:4),gap=8,sz=Math.floor((W()-gap*(cols-1)-4)/cols);
 $('pTitle').textContent=DN[d]+' · 모든 카드 '+D.n+'장';$('pLead').innerHTML='카드 <b>두 장</b>을 고르면 같은 그림이 보여요. 아래 그림을 고르면 그 그림이 든 카드가 모두 보여요.';
 A.activity='모든 카드 보기: '+DN[d];
 const sel=A.sp.sel,mk=A.sp.mark,cm=sel.length===2?common(d,sel[0],sel[1]):null;
 let h=`<div class="pal scroll" id="allPal">${D.pics.map(p=>`<button class="pb${mk===p?' on':''}" data-p="${p}" aria-label="${PIC(p).n}">${PIC(p).e}</button>`).join('')}</div>`;
 h+=`<div class="cgrid" style="grid-template-columns:repeat(${cols},1fr)">`;
 D.cards.forEach((_,i)=>{const pics=deckCard(d,i),has=mk!==null&&pics.indexOf(mk)>=0;
  const cls=(sel.indexOf(i)>=0?'pick':'')+(mk!==null&&!has?' dim':'');
  h+=cardHtml(pics,sz,{id:i,no:i+1,cls,slotCls:(j,p)=>(p===cm&&sel.indexOf(i)>=0)?' good':(has&&p===mk?' mark':'')})});
 $('stage').innerHTML=h+'</div>';
 $('stage').querySelectorAll('.cgrid .dc').forEach(c=>c.onclick=()=>{const i=+c.dataset.c,s=A.sp.sel;A.sp.mark=null;
  const at=s.indexOf(i);if(at>=0)s.splice(at,1);else{if(s.length>=2)s.shift();s.push(i)}drawAll()});
 $('allPal').querySelectorAll('.pb').forEach(b=>b.onclick=()=>{const p=+b.dataset.p;A.sp.mark=A.sp.mark===p?null:p;A.sp.sel=[];drawAll()});
 if(cm!==undefined&&cm!==null)setMsg((sel[0]+1)+'번과 '+(sel[1]+1)+'번 카드의 같은 그림: '+PIC(cm).e+' '+PIC(cm).n,'ok');
 else if(mk!==null){const n=D.cards.filter((_,i)=>deckCard(d,i).indexOf(mk)>=0).length;setMsg(PIC(mk).e+' '+josa(PIC(mk).n,'이','가')+' 든 카드: '+n+'장')}
 else setMsg(sel.length===1?'한 장 더 골라요.':'');
 $('ctrl').innerHTML='';$('gnote').textContent='어떤 두 카드를 골라도 같은 그림이 꼭 하나예요. 그림 하나는 몇 장의 카드에 들어 있을까요?';
}

/* ═════════ 2) 미니 도블 만들기 ═════════ */
const BK=()=>A.bank.build;
const bpic=i=>BK().pics[i];       // 만들기 그림 번호(0..) → 전체 그림 번호
function openBuild(pool){
 A.bd.pool=pool;A.bd.cur=[];A.bd.sel=null;A.bd.cards[pool]=A.bd.cards[pool]||[];
 $('poolTabs').hidden=false;
 $('poolTabs').innerHTML=BK().pools.map(p=>`<button class="btn${p===pool?' on':''}" data-p="${p}">그림 ${p}개${A.bd.best[p]?' · '+A.bd.best[p]+'장':''}</button>`).join('');
 $('poolTabs').querySelectorAll('.btn').forEach(b=>b.onclick=()=>openBuild(+b.dataset.p));
 $('pTitle').textContent='미니 도블 만들기 · 그림 '+pool+'개';
 $('pLead').innerHTML='카드 1장에 그림 <b>3개</b>. 어느 두 카드에도 <b>같은 그림이 꼭 하나</b>! 카드를 몇 장까지 만들 수 있을까요?';
 setMsg('그림 3개를 골라 카드를 만들어요.');drawBuild();
}
function useCount(){const n={};(A.bd.cards[A.bd.pool]||[]).forEach(c=>c.forEach(x=>n[x]=(n[x]||0)+1));return n}
function drawBuild(){
 const pool=A.bd.pool,cards=A.bd.cards[pool],cur=A.bd.cur,cnt=useCount(),w=W();
 A.activity='만들기: 그림 '+pool+'개 (카드 '+cards.length+'장)';
 const big=Math.min(150,Math.floor(w*.38));
 let h=`<div class="mk">${cardHtml([0,1,2].map(j=>cur[j]===undefined?null:bpic(cur[j])),big,{id:'new',cls:'blank',slotCls:(j,p)=>p!==null?' fill':(j===cur.length?' next':'')})}<div style="text-align:left;font-size:14px;color:var(--sub);line-height:1.6;max-width:150px">새 카드<br><b style="color:var(--ink)">${cur.length}/3</b> 골랐어요<br>그림을 다시 누르면 빠져요</div></div>`;
 h+=`<div class="pal" id="bPal">${Array.from({length:pool},(_,i)=>`<button class="pb${cur.indexOf(i)>=0?' on':''}" data-i="${i}" aria-label="${PIC(bpic(i)).n}">${PIC(bpic(i)).e}${cnt[i]?`<small>${cnt[i]}</small>`:''}</button>`).join('')}</div>`;
 h+=`<div class="stat3"><div><b>${cards.length}</b><span>지금 카드</span></div><div><b>${A.bd.best[pool]||0}</b><span>내 최고</span></div><div><b id="clsBest">${A.cls[pool]||0}</b><span>우리 반 최고</span></div></div>`;
 if((A.bd.stuck[pool]||[]).length)h+=`<p class="note" style="margin:2px 0 0">🧱 내가 막힌 기록: ${A.bd.stuck[pool].map(x=>x+'장').join(', ')}</p>`;
 h+=`<div class="sec">내 카드 ${cards.length}장 <span class="note" style="font-size:12px">카드를 누르면 뺄 수 있어요 · 그림 위 숫자 = 쓴 횟수</span></div><div class="mylist" id="bList">`;
 const sz=Math.min(92,Math.floor((w-30)/4));
 cards.forEach((c,i)=>{h+=cardHtml(c.map(bpic),sz,{id:i,no:i+1,cls:(A.bd.sel===i?'sel':'')+(A.bd.bad===i?' bad':'')})});
 if(!cards.length)h+='<span class="note">아직 카드가 없어요.</span>';
 $('stage').innerHTML=h+'</div>';
 $('bPal').querySelectorAll('.pb').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,at=A.bd.cur.indexOf(i);A.bd.bad=null;
  if(at>=0)A.bd.cur.splice(at,1);else if(A.bd.cur.length<3)A.bd.cur.push(i);else{setMsg('그림은 3개까지예요. 뺄 그림을 다시 눌러요.','bad');return}
  setMsg(A.bd.cur.length===3?'[카드 추가]를 눌러요.':'그림 3개를 골라 카드를 만들어요.');drawBuild()});
 $('stage').querySelectorAll('.dc[data-c="new"] .p').forEach(b=>b.onclick=()=>{const j=+b.dataset.i;if(A.bd.cur[j]!==undefined){A.bd.cur.splice(j,1);drawBuild()}});
 $('bList').querySelectorAll('.dc').forEach(c=>c.onclick=()=>{const i=+c.dataset.c;A.bd.sel=A.bd.sel===i?null:i;A.bd.bad=null;drawBuild();if(A.bd.sel!==null)setMsg((i+1)+'번 카드를 골랐어요. [이 카드 빼기]를 누르면 빠져요.')});
 $('ctrl').innerHTML=`<button class="btn pri" id="bAdd"${cur.length===3?'':' disabled'}>＋ 카드 추가</button><button class="btn" id="bClr">새 카드 비우기</button>`+
  (A.bd.sel!==null?`<button class="btn wide" id="bDel">${A.bd.sel+1}번 카드 빼기</button>`:'')+
  `<button class="btn wide" id="bStuck"${cards.length?'':' disabled'}>🤔 더 만들 수 없어요?<span class="hintc">확인만 해요 · 눌러도 카드는 그대로, 계속 만들 수 있어요</span></button>`+
  `<button class="btn wide" id="bAll">카드 모두 지우기</button>`;
 $('bAdd').onclick=addCard;$('bClr').onclick=()=>{A.bd.cur=[];drawBuild()};$('bStuck').onclick=checkStuck;
 if($('bDel'))$('bDel').onclick=()=>{cards.splice(A.bd.sel,1);A.bd.sel=null;setMsg('카드를 뺐어요.');drawBuild()};
 $('bAll').onclick=()=>{if(!cards.length)return;$('bAll').outerHTML='<span class="wide" style="grid-column:1/-1;display:flex;gap:6px"><button class="btn" id="bAllY" style="flex:1">모두 지우기</button><button class="btn" id="bAllN" style="flex:1">취소</button></span>';
  $('bAllY').onclick=()=>{A.bd.cards[pool]=[];A.bd.sel=null;setMsg('모두 지웠어요. 기록(내 최고)은 남아 있어요.');drawBuild()};$('bAllN').onclick=drawBuild};
 $('gnote').textContent='더 만들 수 없을 것 같으면 다른 그림 수로도 해 봐요. 그림을 늘리면 카드도 늘어날까요?';
}
function drawBuildStats(){const e=$('clsBest');if(e)e.textContent=A.cls[A.bd.pool]||0}
/* 지금 카드들에 규칙에 맞게 더 붙일 수 있는 카드가 있는지 모든 경우를 따져 봐요 (어떤 카드인지는 알려 주지 않아요) */
function canExtend(pool,cards){for(let a=0;a<pool;a++)for(let b=a+1;b<pool;b++)for(let c=b+1;c<pool;c++){const t=[a,b,c];if(cards.every(x=>t.filter(v=>x.indexOf(v)>=0).length===1))return true}return false}
async function checkStuck(){
 if(A.busy)return;const pool=A.bd.pool,cards=A.bd.cards[pool];if(!cards.length)return;
 if(!canPlay()){setMsg('지금은 확인할 수 없어요.','bad');return}
 if(canExtend(pool,cards)){setMsg('아직 붙일 수 있는 카드가 있어요. 더 찾아봐요! 🔍','bad');return}
 A.busy=true;
 try{const r=await call('api_stuck',A.name,A.token,{roundId:A.round,pool,cards});A.bd.stuck[pool]=r.stuck;
  drawBuild();
  setMsg('맞아요! 이 '+cards.length+'장에는 더 붙일 수 없어요. 처음부터 다르게 만들면 더 많이 만들 수 있을까요?','ok')}
 catch(e){setMsg(errText(e),'bad')}finally{A.busy=false}
}
async function addCard(){
 if(A.busy||A.bd.cur.length!==3)return;if(!canPlay()){setMsg('지금은 만들 수 없어요.','bad');return}
 const pool=A.bd.pool,cards=A.bd.cards[pool],nc=A.bd.cur.slice().sort((a,b)=>a-b);
 for(let i=0;i<cards.length;i++){const same=cards[i].filter(x=>nc.indexOf(x)>=0).length;
  if(same!==1){A.bd.bad=i;drawBuild();setMsg(same===0?(i+1)+'번 카드와 같은 그림이 없어요. 꼭 1개 있어야 해요.':(same===3?(i+1)+'번 카드와 똑같은 카드예요.':(i+1)+'번 카드와 같은 그림이 '+same+'개예요. 꼭 1개여야 해요.'),'bad');return}}
 cards.push(nc);A.bd.cur=[];A.bd.sel=null;A.bd.bad=null;
 const n=cards.length,isBest=n>(A.bd.best[pool]||0);if(isBest)A.bd.best[pool]=n;   // '내 최고'가 바로 보이게 먼저 바꿔요
 setMsg('카드 '+n+'장! 한 장 더 만들 수 있을까요?','ok');drawBuild();
 if(isBest){
  try{A.busy=true;const r=await call('api_build',A.name,A.token,{roundId:A.round,pool,cards});
   if(r.classBest)A.cls[pool]=n;   // 알림은 띄우지 않고 '우리 반 최고' 칸만 조용히 바뀌어요
   openBuildTabsOnly();drawBuildStats()}
  catch(e){setMsg(errText(e),'bad')}finally{A.busy=false}}
}
function openBuildTabsOnly(){$('poolTabs').querySelectorAll('.btn').forEach(b=>{const p=+b.dataset.p;b.textContent='그림 '+p+'개'+(A.bd.best[p]?' · '+A.bd.best[p]+'장':'')})}

/* ═════════ 3) 빠진 카드 찾기 (연습 3문제 · 실전 8문제) ═════════
   연습: 세 문제가 모두 열려 있고, 점수가 없고, 힌트도 감점 없이 마음껏. 실전: 도착한 번호까지만, 10점, 힌트 2번까지 −3점 */
const isPrac=()=>A.game==='real'&&A.mode==='practice';
const realList=()=>isPrac()?A.bank.prac:A.bank.real;
const isDone=i=>!!(A.me&&A.me.done&&A.me.done[i]);
const hintsUsed=i=>(A.me&&A.me.hintBy&&A.me.hintBy[i])||0;
const reachN=()=>isPrac()?realList().length-1:((A.me&&A.me.reach)||0);
function firstOpen(){const R=reachN();for(let i=0;i<=R;i++)if(!isDone(i))return i;return R}
function nextOpen(from){const R=reachN();for(let j=from+1;j<=R;j++)if(!isDone(j))return j;for(let j=0;j<from;j++)if(!isDone(j))return j;return -1}
function drawNums(){const L=realList(),cur=A.real.cur;const R=reachN();A.real.shownReach=R;$('nums').hidden=false;
 $('nums').innerHTML=L.map((p,i)=>i>R?`<button class="num lock" disabled aria-label="${i+1}번 잠김">🔒${i+1}</button>`:`<button class="num${isDone(i)?' done':A.real.seen[i]?' seen':''}${i===cur?' cur':''}" data-i="${i}">${i+1}</button>`).join('');
 $('nums').querySelectorAll('.num[data-i]').forEach(b=>b.onclick=()=>{if(!A.busy)openReal(+b.dataset.i)});
 const on=$('nums').querySelector('.cur');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
 if(A.game==='real'&&R_)drawCtrlReal()}
let R_=null;   // 지금 풀고 있는 문제: {i, q, fill:{카드:[...]}, hint:{'카드:칸':1}, sel, bad:[]}
function openReal(i){
 if(i>reachN())i=reachN();
 const L=realList(),q=L[i];A.real.cur=i;A.real.seen[i]=1;
 const sv=A.real.saved[i];
 const fill={};q.cards.forEach((c,ci)=>{if(c.indexOf(null)>=0)fill[ci]=sv?sv.fill[ci].slice():c.slice()});
 const blanks=Object.keys(fill).map(Number);
 R_={i,q,fill,hint:sv?Object.assign({},sv.hint):{},sel:blanks[0],bad:[]};
 const solvedN=L.filter((_,k)=>isDone(k)).length;
 $('pTitle').textContent=(isPrac()?'연습 ':'')+(i+1)+'번 · '+q.title;
 $('pLead').innerHTML=q.kind==='miss'?`카드 <b>${blanks.length}장</b>이 빠졌어요. 노란 빈 카드를 채워 덱을 완성해요.`:`빈칸 <b>?</b>를 채워요. 어느 두 카드에도 <b>같은 그림이 꼭 하나</b>!`;
 A.activity=(isPrac()?'연습 ':'실전 ')+(i+1)+'번 (성공 '+solvedN+'/'+L.length+')';
 drawNums();drawReal();
 setMsg(isDone(i)?'✓ 이미 푼 문제예요. 다른 번호를 골라요.':'노란 카드를 고르고, 아래 그림을 눌러 채워요.',isDone(i)?'ok':'');
 if(solvedN===L.length)setMsg(isPrac()?'🎉 연습 문제를 다 풀었어요! 실전을 기다려요.':'🎉 모든 문제를 다 풀었어요! 결과를 기다려요.','ok');
 $('gnote').textContent=isPrac()?'연습이라 점수가 없어요. 힌트도 감점 없이 마음껏 눌러 봐요. 실전에서는 1번에 −3점이에요.':'다른 번호에 갔다 와도 채운 그림은 그대로예요. 노란 테두리 그림 = 힌트로 받은 그림(바꿀 수 없어요).';
}
function saveReal(){if(R_)A.real.saved[R_.i]={fill:JSON.parse(JSON.stringify(R_.fill)),hint:Object.assign({},R_.hint)}}
function drawReal(){
 if(!R_)return;const q=R_.q,w=W(),cols=4,gap=8,n=q.cards.length;
 const sz=Math.floor((w-gap*(cols-1)-4)/cols),done=isDone(R_.i);
 let h=`<div class="cgrid" style="grid-template-columns:repeat(${cols},1fr)">`;
 q.cards.forEach((c,ci)=>{const isB=R_.fill[ci]!==undefined,pics=isB?R_.fill[ci]:c;
  const cls=(isB?'blank':'')+(R_.sel===ci&&isB&&!done?' sel':'')+(R_.bad.indexOf(ci)>=0?' bad':'');
  h+=cardHtml(pics,sz,{id:ci,no:ci+1,cls,slotCls:(j,p)=>isB&&c[j]===null?(' slot'+(p!==null?(R_.hint[ci+':'+j]?' hint':' fill'):'')):''})});
 h+='</div>';
 if(!done&&R_.sel!==undefined){const ci=R_.sel,c=q.cards[ci],f=R_.fill[ci],nx=f.findIndex((x,j)=>x===null);
  const big=Math.min(130,Math.floor(w*.33));
  h+=`<div class="edit"><div>${cardHtml(f,big,{id:'ed',no:ci+1,cls:'blank',slotCls:(j,p)=>c[j]===null?(' slot'+(p!==null?(R_.hint[ci+':'+j]?' hint':' fill'):(j===nx?' next':''))):''})}</div>`+
   `<div class="pal" id="rPal">${q.pics.map(p=>`<button class="pb${f.indexOf(p)>=0?' on':''}" data-p="${p}" aria-label="${PIC(p).n}">${PIC(p).e}</button>`).join('')}</div></div>`}
 $('stage').innerHTML=h;
 $('stage').querySelectorAll('.cgrid .dc').forEach(el=>el.onclick=()=>{const ci=+el.dataset.c;if(R_.fill[ci]===undefined||done)return;R_.sel=ci;R_.bad=[];drawReal()});
 $('stage').querySelectorAll('.dc[data-c="ed"] .p').forEach(b=>b.onclick=e=>{e.stopPropagation();const j=+b.dataset.i,ci=R_.sel;
  if(q.cards[ci][j]!==null||R_.fill[ci][j]===null)return;
  if(R_.hint[ci+':'+j]){setMsg('힌트로 받은 그림은 바꿀 수 없어요.','bad');return}
  R_.fill[ci][j]=null;R_.bad=[];saveReal();drawReal();setMsg('그림을 뺐어요.')});
 if($('rPal'))$('rPal').querySelectorAll('.pb').forEach(b=>b.onclick=()=>pickReal(+b.dataset.p));
 drawCtrlReal();
}
function pickReal(p){
 if(!R_||A.busy||isDone(R_.i))return;if(!canPlay()){setMsg('지금은 채울 수 없어요.','bad');return}
 const ci=R_.sel,f=R_.fill[ci],c=R_.q.cards[ci];
 const at=f.indexOf(p);
 if(at>=0){if(c[at]!==null){setMsg('원래 있던 그림이에요.','bad');return}if(R_.hint[ci+':'+at]){setMsg('힌트로 받은 그림은 바꿀 수 없어요.','bad');return}f[at]=null;R_.bad=[];saveReal();drawReal();setMsg('그림을 뺐어요.');return}
 const j=f.findIndex(x=>x===null);
 if(j<0){setMsg('빈칸이 없어요. 바꿀 그림을 먼저 눌러 빼요.','bad');return}
 f[j]=p;R_.bad=[];saveReal();
 // 이 카드를 다 채웠으면 다음 빈 카드로
 if(f.indexOf(null)<0){const nb=Object.keys(R_.fill).map(Number).find(k=>R_.fill[k].indexOf(null)>=0);if(nb!==undefined)R_.sel=nb}
 drawReal();setMsg(Object.keys(R_.fill).every(k=>R_.fill[k].indexOf(null)<0)?'다 채웠어요! [확인하기]를 눌러요.':'');
}
function drawCtrlReal(){
 if(!R_)return;const i=R_.i,u=hintsUsed(i),left=isPrac()?1:2-u,done=isDone(i),L=realList();
 const ci=R_.sel,canClr=!done&&ci!==undefined;
 $('ctrl').innerHTML=`<button class="btn pri" id="rChk"${done?' disabled':''}>✓ 확인하기</button>`+
  (isPrac()?`<button class="btn" id="rHint"${done?' disabled':''}>💡 힌트<span class="hintc">연습은 감점 없음</span></button>`:`<button class="btn" id="rHint"${left<=0||done?' disabled':''}>힌트 ${left}번<span class="hintc">1번에 −3점</span></button>`)+
  `<button class="btn" id="rClr"${canClr?'':' disabled'}>${ci!==undefined?(ci+1)+'번 카드 ':''}지우기</button>`+
  `<button class="btn" id="rNext">${i===reachN()&&i<L.length-1&&!done?'넘어가기 →':'다음 문제 →'}</button>`;
 $('rChk').onclick=checkReal;$('rHint').onclick=realHint;$('rNext').onclick=()=>goNext(i);
 $('rClr').onclick=()=>{if(!canClr)return;const c=R_.q.cards[ci];R_.fill[ci]=R_.fill[ci].map((x,j)=>c[j]!==null||R_.hint[ci+':'+j]?x:null);R_.bad=[];saveReal();drawReal();setMsg('지웠어요. (힌트 그림은 남아요)')};
}
function deckNow(){return R_.q.cards.map((c,ci)=>R_.fill[ci]||c)}
async function checkReal(){
 if(!R_||A.busy||isDone(R_.i))return;if(!canPlay()){setMsg('지금은 제출할 수 없어요.','bad');return}
 if(Object.keys(R_.fill).some(k=>R_.fill[k].indexOf(null)>=0)){setMsg('아직 빈칸이 있어요. 모두 채워요.','bad');return}
 const D=deckNow();
 for(let a=0;a<D.length;a++)for(let b=a+1;b<D.length;b++){const s=D[a].filter(x=>D[b].indexOf(x)>=0).length;
  if(s!==1){R_.bad=[a,b];drawReal();setMsg('아직 아니에요! '+(a+1)+'번과 '+(b+1)+'번 카드에 같은 그림이 '+s+'개예요. 꼭 1개여야 해요.','bad');return}}
 A.busy=true;setMsg('확인하는 중…');const i=R_.i;
 try{const r=await call('api_submit',A.name,A.token,{roundId:A.round,puzzle:i,fills:R_.fill});
  A.me=r.me;saveReal();updTop();if(r.prac)toast('성공!','연습 '+(i+1)+'번 덱 완성');else toast('+'+r.points+'점',r.hints?('힌트 '+r.hints+'번 사용'):'덱 완성!');drawNums();drawReal();
  setTimeout(()=>{A.busy=false;if(A.game!=='real')return;const j=nextOpen(i);openReal(j>=0?j:i)},1200);
 }catch(e){A.busy=false;setMsg(errText(e),'bad')}
}
async function realHint(){
 if(!R_||A.busy||isDone(R_.i))return;A.busy=true;$('rHint').disabled=true;const i=R_.i;
 try{const r=await call('api_hint',A.name,A.token,{roundId:A.round,puzzle:i,fills:R_.fill});
  A.me.hintBy=A.me.hintBy||{};A.me.hintBy[i]=r.used;A.busy=false;
  const old=R_.fill[r.card][r.slot];
  // 같은 그림이 이 카드의 다른 칸에 있었다면 그 칸은 비운다
  const dup=R_.fill[r.card].indexOf(r.pic);if(dup>=0&&dup!==r.slot&&!R_.hint[r.card+':'+dup])R_.fill[r.card][dup]=null;
  R_.fill[r.card][r.slot]=r.pic;R_.hint[r.card+':'+r.slot]=1;R_.sel=r.card;R_.bad=[];saveReal();drawReal();
  setMsg('힌트: '+(r.card+1)+'번 카드에 '+PIC(r.pic).e+' '+PIC(r.pic).n+(old!==null&&old!==undefined?' ('+PIC(old).n+' 대신)':'')+(r.prac?' · 연습이라 감점 없어요':' · 이 문제 −'+(3*r.used)+'점'));
 }catch(e){A.busy=false;setMsg(errText(e),'bad');drawCtrlReal()}
}
async function goNext(i){
 if(A.busy)return;const R=reachN(),L=realList();
 if(i===R&&R<L.length-1&&!isDone(i)){
  A.busy=true;$('rNext').disabled=true;
  try{const r=await call('api_skip',A.name,A.token,{roundId:A.round,puzzle:i});A.me=r.me;A.busy=false;openReal(reachN())}
  catch(e){A.busy=false;$('rNext').disabled=false;setMsg(errText(e),'bad')}
  return}
 const j=nextOpen(i);
 if(j>=0)openReal(j);else if(i!==R)openReal(R);else setMsg('열린 문제를 모두 풀었어요!','ok');
}

boot();
</script>
